baseURL: "https://withdong02.top/"
title: withdong02
paginate: 5
theme: PaperMod
defaultContentLanguage: zh
defaultContentLanguageInSubdir: false
hasCJKLanguage: true

languages:
  zh:
    locale: zh
    label: 中文
    weight: 1



enableRobotsTXT: true
buildDrafts: false
buildFuture: true
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home: [HTML, RSS, JSON]

services:
  googleAnalytics:
    ID: G-W7C1XDVYLL

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: withdong02 
  description: "分享 Java、算法、Web开发等技术心得，记录学习成长之路"
  keywords: [Java,算法,Web开发,技术博客,withdong02]
  author: withdong02
  # author: ["Me", "You"] # multiple authors
  analytics:
    google:
      SiteVerificationTag: "cSzMmRaz1N0azlkz9Kz9JYevONaGzayMLsgvKNh06Mo"
  defaultTheme: light # dark, light, auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true

  # giscus comments (https://giscus.app)
  giscus:
    repo: "withdong02/Blog"
    repoId: "R_kgDOSDi3UQ"
    category: "General"
    categoryId: "DIC_kwDOSDi3Uc4DDWBZ"
    mapping: pathname
    strict: "0"
    reactionsEnabled: "1"
    emitMetadata: "0"
    inputPosition: top
    theme: preferred_color_scheme
    lang: "zh-CN"
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: true # expanded by default across all posts

  # profile-mode
  profileMode:
    enabled: false # needs to be explicitly set
    title: withdong02
    subtitle: "Keep Learning!"
    imageUrl: "/author.jpg"
    imageWidth: 120
    imageHeight: 120
    imageTitle: my image
    buttons:
      - name: Posts
        url: posts
      - name: Tags
        url: tags

  # home-info mode
  homeInfoParams:
    Title: "叫我蕫冬咚 \U0001F44B"
    Content: "普通人如果想比别人更上一层楼，就要多按一层电梯。"

  socialIcons:
    - name: github
      url: "https://github.com/withdong02"
    - name: email
      url: "/games/spider-solitaire.html"
    - name: wechat
      url: "/games/minesweeper.html"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  editPost:
    URL: "https://github.com/withdong02/Blog/edit/master/content"
    appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]
menu:
  main:
    - identifier: taxonomies
      name: taxonomies
      url: /taxonomies/
      weight: 10
    - identifier: search
      name: search
      title: 搜索
      url: /search/
      weight: 5
      pre: >-
        <svg role="img" aria-label="搜索" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    - identifier: archives
      name: archives
      url: /archives
      weight: 30
    - identifier: about
      name: about
      url: /about/
      weight: 40
# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai
