<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>扫雷游戏</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --cell-size: 26px;
    --board-padding: 6px;
}

html, body {
    font-family: 'Microsoft YaHei', SimHei, sans-serif;
    background-color: #c0c0c0;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: auto;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 10px;
    overflow-x: auto;
}

.game-container {
    background-color: #c0c0c0;
    border: 2px solid;
    border-color: #ffffff #7b7b7b #7b7b7b #ffffff;
    padding: var(--board-padding);
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: fit-content;
}

.header {
    margin-bottom: 6px;
}

.info-panel {
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #c0c0c0;
    padding: 6px 10px;
    border: 2px solid;
    border-color: #7b7b7b #ffffff #ffffff #7b7b7b;
    font-size: calc(var(--cell-size) * 0.65);
    font-weight: bold;
    gap: calc(var(--cell-size) * 0.8);
}

.timer, .mines {
    display: flex;
    align-items: center;
    gap: 3px;
    color: #000;
    white-space: nowrap;
}

.face {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #000;
}

#face-icon {
    font-size: calc(var(--cell-size) * 0.85);
    cursor: pointer;
    width: calc(var(--cell-size) * 1.3);
    height: calc(var(--cell-size) * 1.3);
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #c0c0c0;
    border: 2px solid;
    border-color: #ffffff #7b7b7b #7b7b7b #ffffff;
}

#face-icon:active {
    border-color: #7b7b7b #ffffff #ffffff #7b7b7b;
}

#timer-display, #mine-count {
    color: #ff0000;
    background-color: #000;
    padding: 2px 4px;
    font-family: 'Courier New', monospace;
    font-size: calc(var(--cell-size) * 0.7);
    border: 2px solid;
    border-color: #7b7b7b #ffffff #ffffff #7b7b7b;
    min-width: 3ch;
    text-align: center;
}

.difficulty-selector {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
    justify-content: center;
    flex-wrap: wrap;
}

.difficulty-btn {
    padding: 4px 12px;
    border: 2px solid;
    border-color: #ffffff #7b7b7b #7b7b7b #ffffff;
    background-color: #c0c0c0;
    cursor: pointer;
    font-family: inherit;
    font-size: calc(var(--cell-size) * 0.55);
    font-weight: bold;
    transition: all 0.15s ease;
}

.difficulty-btn:hover {
    background-color: #d0d0d0;
}

.difficulty-btn.active {
    background-color: #c0c0c0;
    color: #000;
    border-color: #7b7b7b #ffffff #ffffff #7b7b7b;
}

.game-board-wrapper {
    overflow-x: auto;
    overflow-y: auto;
    display: block;
    margin-bottom: 6px;
    -webkit-overflow-scrolling: touch;
}

.game-board {
    display: grid;
    gap: 1px;
    background-color: #c0c0c0;
    border: 2px solid;
    border-color: #7b7b7b #ffffff #ffffff #7b7b7b;
    padding: 2px;
    flex-shrink: 0;
}

.cell {
    width: var(--cell-size);
    height: var(--cell-size);
    border: 2px solid;
    border-color: #ffffff #7b7b7b #7b7b7b #ffffff;
    background-color: #c0c0c0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: calc(var(--cell-size) * 0.55);
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
}

.cell.revealed {
    border: 1px solid #7b7b7b;
    background-color: #c0c0c0;
}

.cell.mine {
    background-color: #c0c0c0;
    color: #000;
}

.cell.flagged {
    background-color: #c0c0c0;
    color: #000;
}

.cell.num-1 { color: #0000ff; }
.cell.num-2 { color: #008000; }
.cell.num-3 { color: #ff0000; }
.cell.num-4 { color: #000080; }
.cell.num-5 { color: #800000; }
.cell.num-6 { color: #008080; }
.cell.num-7 { color: #000000; }
.cell.num-8 { color: #808080; }

.controls {
    text-align: center;
}

.control-btn {
    padding: 6px 16px;
    border: 2px solid;
    border-color: #ffffff #7b7b7b #7b7b7b #ffffff;
    background-color: #c0c0c0;
    cursor: pointer;
    font-family: inherit;
    font-size: calc(var(--cell-size) * 0.55);
    font-weight: bold;
    transition: all 0.15s ease;
}

.control-btn:active {
    border-color: #7b7b7b #ffffff #ffffff #7b7b7b;
}

.game-over .cell {
    cursor: default;
}

.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s;
    padding: 20px;
}

.modal.show {
    opacity: 1;
    visibility: visible;
}

.modal-content {
    background-color: #c0c0c0;
    border: 2px solid;
    border-color: #ffffff #7b7b7b #7b7b7b #ffffff;
    padding: 20px;
    text-align: center;
    transform: scale(0.9);
    transition: transform 0.3s;
    max-width: 90vw;
    max-height: 90vh;
    overflow-y: auto;
}

.modal.show .modal-content {
    transform: scale(1);
}

.modal h2 {
    margin-bottom: 15px;
    color: #000;
    font-size: calc(var(--cell-size) * 0.8);
}

.qrcode-img {
    width: min(180px, 50vw);
    height: min(180px, 50vw);
    max-width: 180px;
    max-height: 180px;
    margin-bottom: 15px;
    border: 2px solid;
    border-color: #7b7b7b #ffffff #ffffff #7b7b7b;
}

.close-modal {
    padding: 6px 20px;
    border: 2px solid;
    border-color: #ffffff #7b7b7b #7b7b7b #ffffff;
    background-color: #c0c0c0;
    cursor: pointer;
    font-size: calc(var(--cell-size) * 0.55);
    font-weight: bold;
}

.close-modal:active {
    border-color: #7b7b7b #ffffff #ffffff #7b7b7b;
}

@media (max-width: 480px) {
    :root {
        --cell-size: 16px;
        --board-padding: 4px;
    }
}

@media (max-height: 500px) and (orientation: landscape) {
    body {
        padding: 4px;
    }
}

@media (min-width: 1200px) {
    :root {
        --cell-size: 30px;
    }
}

* {
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
}
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="info-panel">
                <div class="timer">
                    <span class="clock-icon">🕐</span>
                    <span id="timer-display">000</span>
                </div>
                <div class="face">
                    <span id="face-icon">😊</span>
                    <span id="progress">0%</span>
                </div>
                <div class="mines">
                    <span id="mine-count">010</span>
                    <span class="mine-icon">💣</span>
                </div>
            </div>
        </div>

        <div class="difficulty-selector">
            <button id="easy" class="difficulty-btn active">简单</button>
            <button id="medium" class="difficulty-btn">中等</button>
            <button id="hard" class="difficulty-btn">困难</button>
        </div>

        <div class="game-board-wrapper">
            <div class="game-board" id="game-board">
            </div>
        </div>

        <div class="controls">
            <button id="new-game" class="control-btn">新游戏</button>
        </div>
    </div>

    <div class="modal" id="success-modal">
        <div class="modal-content">
            <h2>恭喜通关！</h2>
            <img src="wechat.jpg" alt="微信二维码" class="qrcode-img">
            <p>这是我的微信二维码</p>
            <button class="close-modal" id="close-modal">关闭</button>
        </div>
    </div>

    <div class="modal" id="hard-modal">
        <div class="modal-content">
            <h2>提示</h2>
            <p>困难模式建议在电脑上游玩，以获得最佳体验</p>
            <button class="close-modal" id="close-hard-modal">继续</button>
        </div>
    </div>

    <div class="modal" id="intro-modal">
        <div class="modal-content">
            <div style="font-size: 52px; line-height: 1.2; margin-bottom: 10px;">💣</div>
            <h2>扫雷挑战</h2>
            <p style="margin: 0 0 20px 0; font-size: 14px; line-height: 1.8; color: #000;">
                扫除所有地雷，通关即可解锁我的联系方式<br>
                祝你顺利通关！
            </p>
            <button class="close-modal" id="close-intro-modal">开始扫雷</button>
        </div>
    </div>

    <script>
class MinesweeperGame {
    constructor() {
        this.difficulties = {
            easy: { rows: 9, cols: 9, mines: 10 },
            medium: { rows: 16, cols: 16, mines: 40 },
            hard: { rows: 16, cols: 30, mines: 99 }
        };

        this.currentDifficulty = 'easy';
        this.gameBoard = [];
        this.gameState = 'playing';
        this.revealedCells = 0;
        this.flaggedCells = 0;
        this.startTime = null;
        this.timer = null;

        this.initializeGame();
        this.bindEvents();
        this.bindModalEvents();
        this.handleResize();

        // 开场提示弹窗：通关解锁联系方式
        document.getElementById('intro-modal').classList.add('show');

        window.addEventListener('load', () => {
            setTimeout(() => this.adjustCellSize(), 100);
        });
    }

    initializeGame() {
        const config = this.difficulties[this.currentDifficulty];
        this.rows = config.rows;
        this.cols = config.cols;
        this.totalMines = config.mines;
        this.gameState = 'playing';
        this.revealedCells = 0;
        this.flaggedCells = 0;
        this.startTime = null;

        this.createBoard();
        this.placeMines();
        this.calculateNumbers();
        this.renderBoard();
        this.updateDisplay();

        if (this.timer) {
            clearInterval(this.timer);
            this.timer = null;
        }

        document.getElementById('timer-display').textContent = '000';
        document.getElementById('face-icon').textContent = '😊';

        setTimeout(() => this.adjustCellSize(), 0);
    }

    createBoard() {
        this.gameBoard = [];
        for (let row = 0; row < this.rows; row++) {
            this.gameBoard[row] = [];
            for (let col = 0; col < this.cols; col++) {
                this.gameBoard[row][col] = {
                    isMine: false,
                    isRevealed: false,
                    isFlagged: false,
                    neighborMines: 0
                };
            }
        }
    }

    placeMines() {
        let minesPlaced = 0;
        while (minesPlaced < this.totalMines) {
            const row = Math.floor(Math.random() * this.rows);
            const col = Math.floor(Math.random() * this.cols);

            if (!this.gameBoard[row][col].isMine) {
                this.gameBoard[row][col].isMine = true;
                minesPlaced++;
            }
        }
    }

    calculateNumbers() {
        for (let row = 0; row < this.rows; row++) {
            for (let col = 0; col < this.cols; col++) {
                if (!this.gameBoard[row][col].isMine) {
                    let count = 0;
                    for (let i = -1; i <= 1; i++) {
                        for (let j = -1; j <= 1; j++) {
                            const newRow = row + i;
                            const newCol = col + j;
                            if (this.isValidCell(newRow, newCol) &&
                                this.gameBoard[newRow][newCol].isMine) {
                                count++;
                            }
                        }
                    }
                    this.gameBoard[row][col].neighborMines = count;
                }
            }
        }
    }

    isValidCell(row, col) {
        return row >= 0 && row < this.rows && col >= 0 && col < this.cols;
    }

    renderBoard() {
        const boardElement = document.getElementById('game-board');
        boardElement.innerHTML = '';
        boardElement.style.gridTemplateColumns = `repeat(${this.cols}, var(--cell-size))`;

        for (let row = 0; row < this.rows; row++) {
            for (let col = 0; col < this.cols; col++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = row;
                cell.dataset.col = col;

                cell.addEventListener('click', (e) => this.handleLeftClick(e, row, col));
                cell.addEventListener('contextmenu', (e) => this.handleRightClick(e, row, col));

                cell.addEventListener('touchstart', (e) => {
                    cell.style.transform = 'scale(0.95)';
                }, { passive: true });

                cell.addEventListener('touchend', (e) => {
                    cell.style.transform = 'scale(1)';
                }, { passive: true });

                boardElement.appendChild(cell);
            }
        }
    }

    adjustCellSize() {
        const root = document.documentElement;

        const container = document.querySelector('.game-container');
        const containerWidth = container ? container.offsetWidth : window.innerWidth - 20;
        const availableWidth = Math.min(containerWidth, window.innerWidth - 20);
        const availableHeight = window.innerHeight - 100;

        const maxCellByWidth = Math.floor(availableWidth / this.cols);
        const maxCellByHeight = Math.floor(availableHeight / this.rows);

        let optimalSize = Math.min(maxCellByWidth, maxCellByHeight);

        const isMobile = window.innerWidth < 500;
        if (this.currentDifficulty === 'hard') {
            optimalSize = isMobile ? Math.min(optimalSize, 14) : Math.min(optimalSize, 28);
        } else {
            optimalSize = Math.min(optimalSize, 32);
        }

        const minSize = isMobile ? 16 : 24;
        const finalSize = Math.max(optimalSize, minSize);

        root.style.setProperty('--cell-size', `${finalSize}px`);
    }

    handleResize() {
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                this.adjustCellSize();
            }, 150);
        });

        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                this.adjustCellSize();
            }, 300);
        });
    }

    handleLeftClick(event, row, col) {
        event.preventDefault();
        if (this.gameState !== 'playing') return;

        const cell = this.gameBoard[row][col];
        if (cell.isRevealed || cell.isFlagged) return;

        if (!this.startTime) {
            this.startTime = Date.now();
            this.startTimer();
        }

        this.revealCell(row, col);
        this.updateDisplay();
        this.checkGameState();
    }

    handleRightClick(event, row, col) {
        event.preventDefault();
        if (this.gameState !== 'playing') return;

        const cell = this.gameBoard[row][col];
        if (cell.isRevealed) return;

        cell.isFlagged = !cell.isFlagged;
        this.flaggedCells += cell.isFlagged ? 1 : -1;

        this.updateCellDisplay(row, col);
        this.updateDisplay();
    }

    revealCell(row, col) {
        const cell = this.gameBoard[row][col];
        if (cell.isRevealed || cell.isFlagged) return;

        cell.isRevealed = true;
        this.revealedCells++;

        if (cell.isMine) {
            this.gameState = 'lost';
            this.revealAllMines();
            document.getElementById('face-icon').textContent = '😵';
            return;
        }

        this.updateCellDisplay(row, col);

        if (cell.neighborMines === 0) {
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    const newRow = row + i;
                    const newCol = col + j;
                    if (this.isValidCell(newRow, newCol)) {
                        this.revealCell(newRow, newCol);
                    }
                }
            }
        }
    }

    updateCellDisplay(row, col) {
        const cell = this.gameBoard[row][col];
        const cellElement = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);

        cellElement.className = 'cell';

        if (cell.isFlagged) {
            cellElement.classList.add('flagged');
            cellElement.textContent = '🚩';
        } else if (cell.isRevealed) {
            cellElement.classList.add('revealed');
            if (cell.isMine) {
                cellElement.classList.add('mine');
                cellElement.textContent = '💣';
            } else if (cell.neighborMines > 0) {
                cellElement.classList.add(`num-${cell.neighborMines}`);
                cellElement.textContent = cell.neighborMines;
            } else {
                cellElement.textContent = '';
            }
        } else {
            cellElement.textContent = '';
        }
    }

    revealAllMines() {
        for (let row = 0; row < this.rows; row++) {
            for (let col = 0; col < this.cols; col++) {
                const cell = this.gameBoard[row][col];
                if (cell.isMine && !cell.isFlagged) {
                    cell.isRevealed = true;
                    this.updateCellDisplay(row, col);
                }
            }
        }
    }

    checkGameState() {
        const totalCells = this.rows * this.cols;
        const cellsToReveal = totalCells - this.totalMines;

        if (this.revealedCells === cellsToReveal && this.gameState === 'playing') {
            this.gameState = 'won';
            document.getElementById('face-icon').textContent = '😎';

            for (let row = 0; row < this.rows; row++) {
                for (let col = 0; col < this.cols; col++) {
                    const cell = this.gameBoard[row][col];
                    if (cell.isMine && !cell.isFlagged) {
                        cell.isFlagged = true;
                        this.flaggedCells++;
                        this.updateCellDisplay(row, col);
                    }
                }
            }
            this.updateDisplay();

            if (this.timer) {
                clearInterval(this.timer);
            }

            setTimeout(() => {
                const modal = document.getElementById('success-modal');
                modal.classList.add('show');
            }, 500);
        }
    }

    updateDisplay() {
        const remainingMines = this.totalMines - this.flaggedCells;
        document.getElementById('mine-count').textContent = remainingMines.toString().padStart(3, '0');

        const totalCells = this.rows * this.cols - this.totalMines;
        const progress = Math.round((this.revealedCells / totalCells) * 100);
        document.getElementById('progress').textContent = `${progress}%`;
    }

    startTimer() {
        this.timer = setInterval(() => {
            const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
            const displayTime = Math.min(elapsed, 999);
            document.getElementById('timer-display').textContent = displayTime.toString().padStart(3, '0');
        }, 1000);
    }

    changeDifficulty(difficulty) {
        this.currentDifficulty = difficulty;

        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        document.getElementById(difficulty).classList.add('active');

        this.initializeGame();
        this.showHardModal();
    }

    bindEvents() {
        document.getElementById('easy').addEventListener('click', () => this.changeDifficulty('easy'));
        document.getElementById('medium').addEventListener('click', () => this.changeDifficulty('medium'));
        document.getElementById('hard').addEventListener('click', () => this.changeDifficulty('hard'));

        document.getElementById('new-game').addEventListener('click', () => this.initializeGame());
        document.getElementById('face-icon').addEventListener('click', () => this.initializeGame());

        document.addEventListener('contextmenu', (e) => {
            if (e.target.classList.contains('cell')) {
                e.preventDefault();
            }
        });
    }

    bindModalEvents() {
        const modal = document.getElementById('success-modal');

        document.getElementById('close-modal').addEventListener('click', () => {
            modal.classList.remove('show');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('show');
            }
        });

        const hardModal = document.getElementById('hard-modal');
        document.getElementById('close-hard-modal').addEventListener('click', () => {
            hardModal.classList.remove('show');
        });

        hardModal.addEventListener('click', (e) => {
            if (e.target === hardModal) {
                hardModal.classList.remove('show');
            }
        });

        const introModal = document.getElementById('intro-modal');
        document.getElementById('close-intro-modal').addEventListener('click', () => {
            introModal.classList.remove('show');
        });

        introModal.addEventListener('click', (e) => {
            if (e.target === introModal) {
                introModal.classList.remove('show');
            }
        });
    }

    showHardModal() {
        const isMobile = window.innerWidth < 768;
        if (isMobile && this.currentDifficulty === 'hard') {
            const hardModal = document.getElementById('hard-modal');
            hardModal.classList.add('show');
        }
    }
}

document.addEventListener('DOMContentLoaded', () => {
    new MinesweeperGame();
});
    </script>
</body>
</html>
