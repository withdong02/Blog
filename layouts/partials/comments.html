{{- /* giscus comments — https://giscus.app (project override) */ -}}
{{- $giscus := site.Params.giscus -}}
{{- if and $giscus.repo $giscus.repoId $giscus.categoryId -}}
<section class="giscus-comments" aria-label="Comments">
  <div class="giscus"></div>
  <script src="https://giscus.app/client.js"
          data-repo="{{ $giscus.repo }}"
          data-repo-id="{{ $giscus.repoId }}"
          data-category="{{ $giscus.category | default "Announcements" }}"
          data-category-id="{{ $giscus.categoryId }}"
          data-mapping="{{ $giscus.mapping | default "pathname" }}"
          data-strict="{{ $giscus.strict | default "0" }}"
          data-reactions-enabled="{{ $giscus.reactionsEnabled | default "1" }}"
          data-emit-metadata="{{ $giscus.emitMetadata | default "0" }}"
          data-input-position="{{ $giscus.inputPosition | default "top" }}"
          data-theme="{{ $giscus.theme | default "preferred_color_scheme" }}"
          data-lang="{{ $giscus.lang | default "zh-CN" }}"
          data-loading="lazy"
          crossorigin="anonymous"
          async>
  </script>
</section>
<script>
  /* Keep giscus in sync with the PaperMod theme toggle */
  (function () {
    var map = { dark: "dark", light: "light", auto: "preferred_color_scheme" };
    function theme() {
      var t = document.documentElement.dataset.theme || "auto";
      return map[t] || "preferred_color_scheme";
    }
    function sync() {
      var frame = document.querySelector("iframe.giscus-frame");
      if (frame && frame.contentWindow) {
        frame.contentWindow.postMessage(
          { giscus: { setConfig: { theme: theme() } } },
          "https://giscus.app"
        );
      }
    }
    if (window.MutationObserver) {
      new MutationObserver(sync).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["data-theme"]
      });
    }
    window.addEventListener("load", sync);
  })();
</script>
{{- end -}}
